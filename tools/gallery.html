<!doctype html><meta charset="utf-8"><title>gallery</title>
<style>body{margin:0;background:#334;color:#fff;font:12px sans-serif}canvas{display:block}</style>
<canvas id="c" width="1500" height="1400"></canvas>
<script>
(async()=>{
  const files=['data','core','battle','combat','art_terrain','art_units','art_chars'];
  for(const f of files){ await new Promise((res,rej)=>{const s=document.createElement('script');s.src='../js/'+f+'.js?'+Date.now();s.onload=res;s.onerror=()=>rej(f);document.body.appendChild(s);}); }
  window.galleryReady=true;
  window.drawGallery=function(mode){
    const cv=document.getElementById('c'), ctx=cv.getContext('2d'); ctx.fillStyle='#8ec73e'; ctx.fillRect(0,0,cv.width,cv.height);
    const SV=window.SV, Art=SV.Art; ctx.font='12px sans-serif';
    if(mode==='towers'){
      const types=SV.TOWER_ORDER; const cs=90;
      types.forEach((tp,r)=>{ for(let c=0;c<8;c++){ const gem=c<6?{c:c,t:1+(c%5)}:(c===6?null:{c:3,t:5}); const b={type:tp,lv:tp==='inlay'?[1,10,20,30,40,50,60,60][c]:[1,20,40,60,80,100,100,100][c],gem,id:c,aim:-0.5,recoil:c===2?0.1:0,disT:0}; if(tp==='inlay'&&c===6) b.gem=null; Art.drawTower(ctx,b,cs,60+c*(cs+20),150+r*(cs+40),0.5+c*0.1,{}); } });
      // walls, statues, traps
      Art.drawWall(ctx,cs,60,760); ['panlong','niulang','zhinu','lantern'].forEach((s,i)=>Art.drawStatue(ctx,s,cs,180+i*110,760,0.3)); Art.drawTrap(ctx,'clamp',cs,660,760,true); Art.drawTrap(ctx,'mine',cs,770,760,true);
      // gems
      for(let c=0;c<6;c++) for(let t=1;t<=5;t++) Art.gem(ctx,60+t*70,830+c*50,20,c,t,0.3);
    } else if(mode==='wolves'){
      const ids=Object.keys(SV.D.wolves).filter(id=>!SV.wolfDef(id).boss).slice(0,60); let i=0; const cs=64;
      for(const id of ids){ const def=SV.wolfDef(id); const x=60+(i%12)*120, y=90+Math.floor(i/12)*130; const w={def,x:0,y:0,dir:1,walk:0.7+i*0.1,fly:!!def.fly,uid:i,hp:def.a*0.6,maxhp:def.a,slows:i%9===0?[{v:.3,t:1}]:[],poisons:i%11===0?[{dps:1,t:1}]:[],burnT:i%13===0?1:0,stunT:0,curse:null,shield:0,silT:0,invis:false,hitFlash:0,elite:false,boss:def.boss,noBar:true}; Art.drawWolf(ctx,w,x,y+ (w.fly?20:0),cs,0.4+i*0.05,false); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(def.n,x,y+22); i++; }
      Art.drawSheep(ctx,60,900,90,0.3); Art.drawSheep(ctx,180,900,90,0.3,{dir:-1});
    } else if(mode==='map'){
      const list=window.mapList||[0,3,8,21]; let px=10, py=10, rowH=0;
      for(const idx of list){ const m=new SV.MapModel(idx); const cs=36; const bg=Art.buildBackground(m,cs,1,1);
        if(px+bg.W>cv.width){ px=10; py+=rowH+10; rowH=0; }
        ctx.drawImage(bg.canvas,px,py); ctx.save(); ctx.translate(px,py); Art.drawAnimated(ctx,{cs,ox:bg.ox,oy:bg.oy,anim:bg.anim},m,0.5); ctx.restore();
        ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeText(idx+' '+m.name,px+6,py+16); ctx.fillText(idx+' '+m.name,px+6,py+16);
        px+=bg.W+10; rowH=Math.max(rowH,bg.H); }
    }
  };
})();
</script>
